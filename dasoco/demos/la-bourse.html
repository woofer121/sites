    .tv{min-height:100vh;padding:24px 35px 55px;background:radial-gradient(ellipse at 50% -10%,#213e59,transparent 53%),#070d16}.tv-top{display:flex;align-items:center;gap:20px;justify-content:space-between;border-bottom:1px solid #304158;padding-bottom:20px}.tv-brand{font-size:34px;font-weight:950;letter-spacing:.16em}.tv-brand span{color:var(--gold)}.tv-subtitle{font-size:12px;color:#9eb8cf;font-weight:740;letter-spacing:.18em;margin-top:5px}.tv-meta{display:flex;gap:24px;align-items:center}.tv-clock{font-size:28px;font-variant-numeric:tabular-nums;font-weight:850}.tv-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;margin-top:26px}.tv-card{border:1px solid #31435b;border-radius:14px;background:linear-gradient(150deg,#1d344b,#0e1e2f);padding:22px;min-height:193px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;position:relative}.tv-card:after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;background:radial-gradient(circle,#52eeaf0c,transparent)}.tv-cardtop{display:flex;gap:9px;align-items:center}.tv-emoji{font-size:33px}.tv-cardname{font-size:17px;font-weight:850;line-height:1.1}.tv-code{color:#7c95aa;font-size:11px;font-weight:800;letter-spacing:.09em;margin-top:7px}.tv-price{font-size:43px;font-weight:900;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.tv-bottom{display:flex;align-items:center;justify-content:space-between}.tv-delta{font-size:16px;font-weight:800}.tv-spark{width:94px;height:37px}.tv-footer{border-top:1px solid #304258;margin-top:28px;padding-top:19px;display:flex;gap:20px;align-items:center;color:#9ab0c5;font-size:12px}.tv-footer b{color:var(--gold)}.tv-crash{font-size:21px;font-weight:900;text-align:center;letter-spacing:.12em;background:#a52e48;color:#fff;padding:15px;border-radius:10px;animation:crashpulse 1s infinite alternate;margin:22px 0 0}.tv-exit{border:1px solid #455d75;border-radius:8px;background:#1a3045;color:#dce8f6;font-size:11px;padding:10px 12px}.tv-hero{padding:12px 0 0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6fe7b1;font-weight:770}.hidden{display:none!important}.toast{position:fixed;bottom:21px;right:22px;background:#213950;border:1px solid #4d7183;padding:12px 17px;border-radius:10px;box-shadow:var(--shadow);color:#e4fbef;font-size:12px;font-weight:750;max-width:350px;z-index:50;opacity:0;transform:translateY(9px);pointer-events:none;transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:none}

    @media(max-width:720px){.topbar{flex-wrap:wrap;padding-bottom:16px}.brand-icon{width:36px;height:36px}.brandname{font-size:16px}.rightbar{margin-left:auto}.nav{order:3;width:100%;justify-content:space-around}.nav button{flex:1;padding:11px 5px;font-size:12px}.hero{display:block;padding:26px 0 19px}.hero h1{font-size:33px}.hero-action{margin-top:19px}.stats{grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:14px}.stat-value{font-size:23px}.panel-head{padding:17px 14px}.prices-header{grid-template-columns:minmax(100px,1.4fr) .85fr .75fr;padding:13px 11px}.prices-header .sparkhead{display:none}.drinkrow{grid-template-columns:minmax(100px,1.4fr) .85fr .75fr;padding:12px 10px;gap:4px}.drink-ident{gap:7px}.drink-icon{width:30px;height:33px;font-size:18px}.drinkname{font-size:12px}.ticker-name{font-size:9px}.price{font-size:19px}.pct{font-size:12px}.spark{display:none}.side{grid-template-columns:1fr}.admin-head{margin:27px 0 20px}.admin-head h1{font-size:30px}.manage-row{grid-template-columns:1fr auto}.manage-price{font-size:17px}.manage-actions{grid-column:1/-1}.tv{padding:13px 12px}.tv-top{flex-wrap:wrap;gap:8px}.tv-brand{font-size:22px}.tv-clock{font-size:16px}.tv-subtitle{font-size:9px}.tv-grid{grid-template-columns:repeat(2,1fr);gap:9px;margin-top:15px}.tv-card{padding:11px;min-height:145px}.tv-cardname{font-size:12px}.tv-price{font-size:27px}.tv-emoji{font-size:21px}.tv-delta{font-size:12px}.tv-spark{width:45px}.tv-footer{flex-wrap:wrap}.form{padding:16px 14px}.crash-banner{gap:8px;padding:12px}.crash-banner strong{font-size:12px}.crash-banner small{font-size:10px}}

<body>
  <div id="app"></div><div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
  'use strict';
  const KEY='labourse-demo-v3', LEADER='labourse-leader-v3', CHANNEL='labourse-sync-v3';
  const me=Math.random().toString(36).slice(2), euro=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2});
  const defaults=[
    {id:'blonde',name:'Blonde pression',code:'BLND',emoji:'🍺',base:6.50,min:4.00,max:9.50,price:6.50,qty:0},
    {id:'ipa',name:'IPA artisanale',code:'IPAA',emoji:'🍻',base:7.50,min:5.00,max:11.00,price:7.50,qty:0},
    {id:'spritz',name:'Spritz',code:'SPRT',emoji:'🍹',base:9.00,min:6.00,max:13.00,price:9.00,qty:0},
    {id:'mojito',name:'Mojito',code:'MOJT',emoji:'🍸',base:10.00,min:7.00,max:15.00,price:10.00,qty:0},
    {id:'vin',name:'Verre de vin',code:'VINO',emoji:'🍷',base:6.00,min:4.00,max:9.00,price:6.00,qty:0},
    {id:'gin',name:'Gin tonic',code:'GINT',emoji:'🍸',base:11.00,min:8.00,max:16.00,price:11.00,qty:0},
    {id:'soft',name:'Cola / soft',code:'SOFT',emoji:'🥤',base:4.00,min:2.50,max:6.00,price:4.00,qty:0},
    {id:'eau',name:'Eau pétillante',code:'WATR',emoji:'💧',base:3.50,min:2.00,max:5.50,price:3.50,qty:0}
  ];
  function initial(){return {drinks:defaults.map(d=>({...d,history:Array.from({length:18},(_,i)=>({time:Date.now()-(17-i)*4000,v:d.price}))})),cfg:{auto:true,step:0.20,interval:4,crashPercent:35,crashDuration:30},crashUntil:0,crashStart:0,sales:0,events:[{t:Date.now(),type:'start',title:'Ouverture de la séance',sub:'Les premières cotations sont disponibles'}],updated:Date.now(),rev:0};}
  const app=document.getElementById('app');let state;let view='market',selected='blonde',editId=null,latestSimulation=Date.now(),lastDrift=Date.now(),lastRender=0,toastTimer=null;
  function escape(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function round(v){return Math.round((v+Number.EPSILON)*100)/100;}
  function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
  function money(v){return euro.format(v);}
  function time(t){return new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
  function diff(d){let p=effective(d);return ((p-d.base)/d.base)*100;}
  function percentage(d){const n=diff(d);return (n>0?'+':'')+n.toFixed(1).replace('.',',')+' %';}
  function direction(d){let v=diff(d);return v>.09?'up':v<-.09?'down':'neutral';}
  function effective(d){if(state.crashUntil>Date.now())return round(Math.max(d.min,d.price*(1-state.cfg.crashPercent/100)));return d.price;}
  function isCrash(){return state.crashUntil>Date.now();}
  function snapshot(){let now=Date.now();state.drinks.forEach(d=>{d.history=(d.history||[]).concat({time:now,v:effective(d)}).slice(-44);});}
  function flash(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600);}
  function save(){state.updated=Date.now();state.rev=(state.rev||0)+1;try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}try{broadcast?.postMessage({type:'state',payload:state,sender:me});}catch(e){}}
  function loaded(){try{const raw=localStorage.getItem(KEY);if(raw){const x=JSON.parse(raw);if(Array.isArray(x.drinks)&&x.cfg&&x.drinks.length)return x;}}catch(e){}return initial();}
  state=loaded();if(!state.drinks.some(d=>d.id===selected))selected=state.drinks[0]?.id;
  let broadcast=null;try{broadcast=new BroadcastChannel(CHANNEL);broadcast.onmessage=e=>{if(e.data?.type==='state'&&e.data.sender!==me&&e.data.payload?.updated>=state.updated){state=e.data.payload;render();}};}catch(e){}
  window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{let next=JSON.parse(e.newValue);if(next.updated>=state.updated){state=next;render();}}catch(e){}}});
  function leader(){try{const old=JSON.parse(localStorage.getItem(LEADER)||'null');const now=Date.now();if(!old||old.expires<now||old.id===me){localStorage.setItem(LEADER,JSON.stringify({id:me,expires:now+4200}));return true;}return false;}catch(e){return true;}}
  function pushEvent(type,title,sub){state.events.unshift({t:Date.now(),type,title,sub});state.events=state.events.slice(0,14);}
  function trade(id,count=1,auto=false){const d=state.drinks.find(x=>x.id===id);if(!d)return;count=clamp(Math.round(count)||1,1,20);d.qty=(d.qty||0)+count;state.sales+=count;
    const increase=round((Number(state.cfg.step)||.2)*count);d.price=round(clamp(d.price+increase,d.min,d.max));
    state.drinks.filter(x=>x.id!==id).forEach(o=>{o.price=round(clamp(o.price-increase*.13,o.min,o.max));});
    pushEvent('sale',`${count} × ${d.name}`,`${auto?'Vente simulée automatiquement':'Vente saisie manuellement'} · ${money(effective(d))}`);snapshot();save();render();}
  function drift(){state.drinks.forEach(d=>{const toward=(d.base-d.price)*.065;const pressure=state.cfg.step*.08;d.price=round(clamp(d.price+toward-pressure,d.min,d.max));});snapshot();save();render();}
  function crash(){if(isCrash()){state.crashUntil=0;pushEvent('recover','Fin du krach','Retour aux cotations ordinaires');}else{state.crashStart=Date.now();state.crashUntil=Date.now()+state.cfg.crashDuration*1000;pushEvent('crash','KRACH BOURSIER !',`Remise temporaire de ${state.cfg.crashPercent}% sur les prix, planchers respectés`);}snapshot();save();render();}
  function randomTrade(){const drinks=state.drinks;if(!drinks.length)return;const weights=drinks.map(d=>Math.max(.25,1.5-(d.price/d.base-1)*3)+(d.id==='blonde'?.4:0));const sum=weights.reduce((a,b)=>a+b,0);let r=Math.random()*sum,chosen=drinks[0];for(let i=0;i<drinks.length;i++){r-=weights[i];if(r<=0){chosen=drinks[i];break;}}trade(chosen.id,Math.random()<.24?2:1,true);}
  function lineData(vals,width,height,pad=5){if(vals.length<2)vals=[...vals,...vals];const lo=Math.min(...vals),hi=Math.max(...vals),range=Math.max(.2,hi-lo);return vals.map((v,i)=>`${pad+(i/(vals.length-1))*(width-2*pad)},${pad+(1-(v-lo)/range)*(height-2*pad)}`).join(' ');}
  function spark(d,large=false){const w=large?500:100,h=large?155:36;let vals=(d.history||[]).map(a=>a.v);if(vals.length<2)vals=[d.base,effective(d)];if(Math.abs(vals[vals.length-1]-effective(d))>.001)vals.push(effective(d));const col=direction(d)==='up'?'#42e4ae':direction(d)==='down'?'#fa6b83':'#f7c978';const points=lineData(vals,w,h,large?8:3);const fill=large?`<polyline points="${points} ${w-8},${h} 8,${h}" fill="${col}1a" stroke="none"/>`:'';let guides=large?'<line x1="0" y1="40" x2="500" y2="40" stroke="#34465a" stroke-dasharray="4 5"/><line x1="0" y1="78" x2="500" y2="78" stroke="#34465a" stroke-dasharray="4 5"/><line x1="0" y1="116" x2="500" y2="116" stroke="#34465a" stroke-dasharray="4 5"/>':'';return `<svg class="${large?'chart':'spark'}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Graphique de ${escape(d.name)}">${guides}${fill}<polyline points="${points}" fill="none" stroke="${col}" stroke-width="${large?2.6:2.2}" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;}
  function commonHeader(){return `<header class="topbar"><div class="brand"><div class="brand-icon"><svg width="27" height="27" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l6-7 5 4 9-11"/><path d="M17 5h7v7"/><path d="M4 24h20"/></svg></div><div><div class="brandname">LA BOURSE</div><div class="brandsub">BAR · MARCHÉ DES BOISSONS</div></div></div><nav class="nav" aria-label="Navigation"><button data-view="market" class="${view==='market'?'active':''}">Le marché</button><button data-view="admin" class="${view==='admin'?'active':''}">Administration</button><button data-action="tv-new">Écran TV ↗</button></nav><div class="rightbar"><span class="live"><span class="dot"></span>EN DIRECT</span><span id="clock">${time(Date.now())}</span></div></header>`;}
  function banner(){return `<div class="crash-banner ${isCrash()?'visible':''}" id="crash-banner"><span style="font-size:24px">📉</span><div><strong>KRACH BOURSIER EN COURS</strong><div><small>Les cotations chutent de ${state.cfg.crashPercent} %, dans la limite des prix planchers</small></div></div><span class="crash-timer" id="crash-timer">${Math.ceil((state.crashUntil-Date.now())/1000)}s</span></div>`;}
  function market(){let big=state.drinks.slice().sort((a,b)=>diff(b)-diff(a))[0], low=state.drinks.slice().sort((a,b)=>diff(a)-diff(b))[0];let sd=state.drinks.find(x=>x.id===selected)||state.drinks[0];return `<main class="shell">${commonHeader()}<section class="hero"><div><p class="eyebrow">Une expérience de bar unique</p><h1>La tournée fait<br><em>bouger le marché.</em></h1><p class="desc">Ici, les boissons s'échangent au rythme de la demande. Surveillez les cours, repérez les bonnes affaires et profitez d'un éventuel krach !</p></div><div class="hero-action"><button class="btn ghost" data-action="tv">◧ Affichage grand écran</button><button class="btn primary" data-view="admin">⚙ Simuler des ventes</button></div></section>${banner()}<section class="stats"><div class="stat"><div class="stat-label">Boissons cotées</div><div class="stat-value">${state.drinks.length.toString().padStart(2,'0')}</div><div class="stat-foot">Cours mis à jour en direct</div></div><div class="stat"><div class="stat-label">Ventes simulées</div><div class="stat-value">${state.sales}</div><div class="stat-foot">Depuis l'ouverture de la démo</div></div><div class="stat"><div class="stat-label">Meilleure performance</div><div class="stat-value ${big?direction(big):''}">${big?percentage(big):'—'}</div><div class="stat-foot">${big?escape(big.name):'Aucune boisson'}</div></div><div class="stat"><div class="stat-label">Plus forte baisse</div><div class="stat-value ${low?direction(low):''}">${low?percentage(low):'—'}</div><div class="stat-foot">${low?escape(low.name):'Aucune boisson'}</div></div></section><section class="layout"><div class="panel"><div class="panel-head"><div><h2 class="panel-heading">Tableau des cotations</h2><div class="subline">Cliquez sur une boisson pour suivre son évolution</div></div><span class="pill ${isCrash()?'warn':''}"><span class="dot" style="background:currentColor;box-shadow:none"></span>${isCrash()?'KRACH EN COURS':'MARCHÉ OUVERT'}</span></div><div class="prices-header"><span>Boisson / Symbole</span><span>Dernier prix</span><span>Variation</span><span class="sparkhead">Tendance</span></div><div id="quote-list">${state.drinks.map(d=>`<button class="drinkrow ${d.id===selected?'selected':''}" data-select="${escape(d.id)}"><div class="drink-ident"><span class="drink-icon">${escape(d.emoji)}</span><div style="min-width:0"><div class="drinkname">${escape(d.name)}</div><div class="ticker-name">${escape(d.code)}</div></div></div><div class="price">${money(effective(d))}</div><div class="pct ${direction(d)}">${percentage(d)}</div>${spark(d)}</button>`).join('')}</div></div><div class="side"><div class="panel"><div class="panel-head"><div><h2 class="panel-heading">Analyse du cours</h2><div class="subline">Historique de la séance · Démo</div></div><span style="font-size:23px">${escape(sd?.emoji||'📈')}</span></div>${sd?`<div class="chart-wrap"><div class="chart-top"><div><div style="font-weight:820;font-size:17px">${escape(sd.name)}</div><div style="color:#7d94ad;font-size:11px;margin-top:5px;letter-spacing:.1em">${escape(sd.code)} / EUR</div></div><span class="pill">${money(sd.min)} – ${money(sd.max)}</span></div><div class="chart-current">${money(effective(sd))}</div><div class="chart-diff ${direction(sd)}">${percentage(sd)} par rapport au prix d'ouverture</div>${spark(sd,true)}<div class="chart-note"><span>Historique récent</span><span>Évolution simulée</span></div></div>`:''}</div><div class="panel"><div class="panel-head"><div><h2 class="panel-heading">Fil du marché</h2><div class="subline">Dernières opérations enregistrées</div></div><span style="color:var(--mint);font-size:12px">●</span></div><div class="events">${state.events.slice(0,4).map(e=>`<div class="event"><div class="event-badge">${e.type==='sale'?'🧾':e.type==='crash'?'📉':e.type==='recover'?'📈':'🔔'}</div><div><div class="event-title">${escape(e.title)}</div><div class="event-sub">${escape(e.sub)}</div></div><time class="event-time">${time(e.t)}</time></div>`).join('')}</div></div></div></section><p class="footnote">● Démonstration fonctionnelle DASOCO : commandes et achats sont simulés ; aucun encaissement réel, aucune connexion à une caisse. Les cours ne sont pas des prix de vente juridiquement validés.</p></main>`;}
  function form(){const e=editId?state.drinks.find(d=>d.id===editId):null;return `<div class="panel"><div class="panel-head"><div><h2 class="panel-heading">${e?'Modifier la cotation':'Ajouter une boisson'}</h2><div class="subline">Les valeurs sont appliquées immédiatement après validation</div></div>${e?'<button class="btn small ghost" data-action="cancel-edit">Annuler</button>':''}</div><form id="drink-form" class="form"><div class="field wide"><label for="f-name">Nom de la boisson</label><input id="f-name" name="name" maxlength="38" required placeholder="Ex : Moscow Mule" value="${escape(e?.name||'')}"></div><div class="field"><label for="f-code">Symbole boursier</label><input id="f-code" name="code" maxlength="5" placeholder="MULE" value="${escape(e?.code||'')}"></div><div class="field"><label for="f-emoji">Icône (emoji)</label><input id="f-emoji" name="emoji" maxlength="6" placeholder="🍹" value="${escape(e?.emoji||'🍹')}"></div><div class="field"><label for="f-base">Prix de départ (€)</label><input id="f-base" type="number" name="base" min="0.01" max="999" step="0.01" required value="${e?.base??8}"></div><div class="field"><label for="f-price">Cours actuel (€)</label><input id="f-price" type="number" name="price" min="0.01" max="999" step="0.01" required value="${e?.price??8}"></div><div class="field"><label for="f-min">Prix minimum (€)</label><input id="f-min" type="number" name="min" min="0.01" max="999" step="0.01" required value="${e?.min??5}"></div><div class="field"><label for="f-max">Prix maximum (€)</label><input id="f-max" type="number" name="max" min="0.01" max="999" step="0.01" required value="${e?.max??12}"></div><div class="form-error" id="form-error" role="alert"></div><div class="form-actions"><button class="btn primary" type="submit">${e?'✓ Enregistrer':'＋ Ajouter au marché'}</button>${e?`<button class="btn danger" type="button" data-action="delete" data-id="${escape(e.id)}">Supprimer</button>`:''}</div></form></div>`;}
  function admin(){return `<main class="shell">${commonHeader()}<div class="admin-head"><p class="eyebrow">Back-office · Accès de démonstration</p><h1>Poste de contrôle</h1><p>Pilotez les prix, simulez les consommations et déclenchez des événements de marché.</p></div>${banner()}<div class="admin-layout"><div><section class="panel"><div class="panel-head"><div><h2 class="panel-heading">Gestion des boissons</h2><div class="subline">Une vente fait monter le cours de la boisson et baisser légèrement les autres</div></div><button class="btn small" data-action="new-drink">＋ Nouveau</button></div><div class="manage-list">${state.drinks.map(d=>`<div class="manage-row"><div><div class="manage-name">${escape(d.emoji)} ${escape(d.name)} <span class="${direction(d)}" style="font-size:11px">${percentage(d)}</span></div><div class="manage-detail">${escape(d.code)} · ouverture ${money(d.base)} · limites ${money(d.min)} / ${money(d.max)} · ${d.qty||0} vente(s)</div></div><div class="manage-price">${money(effective(d))}</div><div class="manage-actions"><button class="btn small primary" data-sale="${escape(d.id)}">＋ Vente</button><button class="btn small" data-edit="${escape(d.id)}">Modifier</button></div></div>`).join('')}</div></section><div class="callout"><strong>Logique de cette démo</strong> : chaque vente augmente le prix de la boisson achetée de la sensibilité configurée, et diminue légèrement les autres. Les cours reviennent progressivement vers leur prix de départ. Les limites minimum / maximum restent actives, même pendant un krach.</div></div><div style="display:flex;flex-direction:column;gap:22px"><section class="panel"><div class="panel-head"><div><h2 class="panel-heading">Moteur de marché</h2><div class="subline">Ajustez le comportement de la simulation</div></div></div><div class="settings-row"><div><strong>Simulation de ventes</strong><small>Génère des achats automatiquement</small></div><label class="toggle"><input id="auto" type="checkbox" ${state.cfg.auto?'checked':''}><span>${state.cfg.auto?'Activée':'Désactivée'}</span></label></div><div class="settings-row"><div><strong>Impact d'une vente (€)</strong><small>Hausse appliquée par unité vendue</small></div><input type="number" data-cfg="step" min="0.01" max="2" step="0.05" value="${state.cfg.step}"></div><div class="settings-row"><div><strong>Vente auto toutes les (s)</strong><small>Vitesse de simulation</small></div><input type="number" data-cfg="interval" min="2" max="60" step="1" value="${state.cfg.interval}"></div><div class="settings-row"><div><strong>Chute en cas de krach (%)</strong><small>Remise temporaire, plafonnée par le prix minimum</small></div><input type="number" data-cfg="crashPercent" min="5" max="80" step="5" value="${state.cfg.crashPercent}"></div><div class="settings-row"><div><strong>Durée du krach (s)</strong><small>Retour automatique aux prix normaux</small></div><input type="number" data-cfg="crashDuration" min="5" max="180" step="5" value="${state.cfg.crashDuration}"></div><div class="button-holder"><button class="btn danger" data-action="crash">${isCrash()?'⏹ Terminer le krach':'📉 Déclencher un krach'}</button><button class="btn" data-action="reset">↺ Réinitialiser</button></div></section>${form()}<div class="callout"><strong>Multi-écrans :</strong> ouvrez « Écran TV » dans un autre onglet du même navigateur pour tester la synchronisation locale. Pour plusieurs téléviseurs connectés dans le bar, il faudra un serveur central avec synchronisation temps réel. <br><br><strong>Sécurité :</strong> ce poste de contrôle est librement accessible dans la démo ; une version de production nécessitera un compte administrateur et une connexion caisse sécurisée.</div></div></div><p class="footnote">Prototype DASOCO · Données de démonstration uniquement · Paramètres conservés localement sur cet appareil.</p></main>`;}
  function tv(){return `<main class="tv"><div class="tv-top"><div><div class="tv-brand">LA <span>BOURSE</span> <span style="font-size:18px">↗</span></div><div class="tv-subtitle">LE MARCHÉ DES BOISSONS · COTATIONS EN DIRECT</div></div><div class="tv-meta"><span class="live"><span class="dot"></span>COURS EN DIRECT</span><span class="tv-clock" id="clock">${time(Date.now())}</span><button class="tv-exit" data-view="market">✕ Quitter</button></div></div>${isCrash()?`<div class="tv-crash">📉 KRACH BOURSIER — JUSQU'À −${state.cfg.crashPercent} % · FIN DANS <span id="crash-timer">${Math.ceil((state.crashUntil-Date.now())/1000)}</span> s</div>`:`<div class="tv-hero">◆ Suivez la tendance : chaque achat peut modifier les cours</div>`}<div class="tv-grid">${state.drinks.map(d=>`<div class="tv-card"><div class="tv-cardtop"><span class="tv-emoji">${escape(d.emoji)}</span><div><div class="tv-cardname">${escape(d.name)}</div><div class="tv-code">${escape(d.code)}</div></div></div><div class="tv-price">${money(effective(d))}</div><div class="tv-bottom"><div class="tv-delta ${direction(d)}">${direction(d)==='up'?'▲':direction(d)==='down'?'▼':'◆'} ${percentage(d)}</div>${spark(d).replace('class="spark"','class="tv-spark"')}</div></div>`).join('')}</div><div class="tv-footer"><b>LA BOURSE</b><span>Des prix qui montent et qui descendent au rythme du marché</span><span style="margin-left:auto">Cotation simulée · Prix minimum respecté</span></div></main>`;}
  function render(){if(view==='admin'&&document.activeElement&&['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){return;}view=location.hash.replace('#','')||'market';if(!['market','admin','tv'].includes(view))view='market';if(!state.drinks.find(x=>x.id===selected))selected=state.drinks[0]?.id;if(editId&&!state.drinks.find(x=>x.id===editId))editId=null;app.innerHTML=view==='tv'?tv():view==='admin'?admin():market();lastRender=Date.now();}
  function goto(p){location.hash=p;view=p;editId=null;render();window.scrollTo(0,0);}
  function changeCfg(el){let k=el.dataset.cfg;const constraints={step:[.01,2],interval:[2,60],crashPercent:[5,80],crashDuration:[5,180]};let v=Number(el.value);if(!Number.isFinite(v))return;v=clamp(v,...constraints[k]);if(k!=='step')v=Math.round(v);state.cfg[k]=v;save();flash('Paramètre enregistré');}
  function submitDrink(form){const data=Object.fromEntries(new FormData(form).entries());let min=round(Number(data.min)),max=round(Number(data.max)),base=round(Number(data.base)),price=round(Number(data.price));const error=document.getElementById('form-error');if(!data.name?.trim()||![min,max,base,price].every(x=>Number.isFinite(x)&&x>.001)||min>max||base<min||base>max||price<min||price>max){error.textContent='Vérifiez les prix : minimum ≤ prix de départ et cours actuel ≤ maximum.';return;}const id=editId||('new-'+Date.now().toString(36));const item={id,name:data.name.trim().slice(0,38),code:(data.code?.trim()||data.name.trim().slice(0,4)).toUpperCase().slice(0,5),emoji:data.emoji?.trim()||'🍹',base,min,max,price,qty:0,history:[]};let previous=state.drinks.find(d=>d.id===id);if(previous){item.qty=previous.qty;item.history=previous.history;}else{item.history=Array.from({length:15},()=>({time:Date.now(),v:price}));}if(previous)state.drinks=state.drinks.map(d=>d.id===id?item:d);else state.drinks.push(item);pushEvent('edit',previous?'Cotation modifiée':'Nouvelle cotation',item.name+' · '+money(effective(item)));editId=null;save();render();flash(previous?'Boisson mise à jour':'Boisson ajoutée au marché');}
  document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.view){goto(button.dataset.view);return;}if(button.dataset.select){selected=button.dataset.select;render();return;}if(button.dataset.sale){trade(button.dataset.sale,1);return;}if(button.dataset.edit){editId=button.dataset.edit;render();document.querySelector('#drink-form')?.scrollIntoView({behavior:'smooth',block:'center'});return;}switch(button.dataset.action){case'tv':goto('tv');break;case'tv-new':{const u=location.href.split('#')[0]+'#tv';const tab=window.open(u,'_blank');if(tab)tab.opener=null;else flash('Autorisez les nouveaux onglets, puis réessayez.');break;}case'crash':crash();flash(isCrash()?'Krach déclenché !':'Krach terminé');break;case'new-drink':editId=null;render();document.querySelector('#drink-form')?.scrollIntoView({behavior:'smooth',block:'center'});document.getElementById('f-name')?.focus();break;case'cancel-edit':editId=null;render();break;case'delete':if(state.drinks.length<=1){flash('Conservez au moins une boisson');return;}if(confirm('Supprimer cette boisson du marché ?')){state.drinks=state.drinks.filter(d=>d.id!==button.dataset.id);editId=null;save();render();flash('Boisson supprimée');}break;case'reset':if(confirm('Remettre tous les prix, boissons et paramètres de démonstration à zéro ?')){state=initial();editId=null;selected='blonde';latestSimulation=Date.now();save();render();flash('Marché réinitialisé');}break;}});
  document.addEventListener('submit',e=>{if(e.target.id==='drink-form'){e.preventDefault();submitDrink(e.target);}});
  document.addEventListener('change',e=>{if(e.target.id==='auto'){state.cfg.auto=e.target.checked;latestSimulation=Date.now();save();render();flash(state.cfg.auto?'Simulation activée':'Simulation mise en pause');}if(e.target.dataset.cfg){changeCfg(e.target);}});
  window.addEventListener('hashchange',render);
  function tick(){const el=document.getElementById('clock');if(el)el.textContent=time(Date.now());const cd=document.getElementById('crash-timer');if(cd)cd.textContent=String(Math.max(0,Math.ceil((state.crashUntil-Date.now())/1000)))+(view==='tv'?'':'s');
    if(!leader())return;const now=Date.now();if(state.crashUntil&&now>=state.crashUntil){state.crashUntil=0;pushEvent('recover','Marché rétabli','Fin du krach · retour aux cours habituels');snapshot();save();render();}
    if(state.cfg.auto&&now-latestSimulation>state.cfg.interval*1000){latestSimulation=now;randomTrade();}
    if(now-lastDrift>12000){lastDrift=now;drift();}
  }
  render();setInterval(tick,1000);
})();
</script>
</body>
</html>
