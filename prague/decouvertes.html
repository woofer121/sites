<script>
(()=>{
'use strict';
const places=[
{id:'golden-ring',name:'La Maison à l’Anneau d’or',area:'Vieille-Ville · près de Týn',kind:'culture',tag:'Histoire & musée',season:'Intérieur · horaires à vérifier',intro:'Un musée pour visualiser Prague au temps de Charles IV et à l’époque Renaissance, à deux pas des itinéraires les plus fréquentés.',story:'Les expositions « Prague de Charles IV » et « Prague 1606 » donnent des repères concrets pour comprendre comment la ville s’est construite et transformée. C’est une bonne parenthèse culturelle quand le froid ou la foule invite à ralentir.',look:'Repérez les différences entre la ville médiévale et la ville Renaissance : rues, maisons, remparts et usages. Essayez ensuite de retrouver ces couches dans les rues autour de la place.',challenge:'À deux, choisissez chacun un détail de la maquette ou de l’exposition qui vous aurait le plus surpris en arrivant à Prague il y a 600 ans.',map:'House at the Golden Ring Prague',source:'https://www.visitczechia.com/en-us/news/2025/08/n-hidden-gems-of-prague'},
{id:'clam-gallas',name:'Le palais Clam-Gallas',area:'Vieille-Ville · près du pont Charles',kind:'histoire',tag:'Palais baroque',season:'Intérieur · visite à vérifier',intro:'Un palais aristocratique baroque dont les salles racontent la vie mondaine de Prague au XVIIIe siècle.',story:'Le palais a accueilli des figures telles que Mozart et Beethoven. Ses intérieurs richement décorés offrent un contrepoint aux ruelles médiévales et aux grandes églises de la ville.',look:'Prenez le temps de regarder les escaliers, les plafonds et les détails sculptés : le décor était aussi une manière d’afficher le rang et le pouvoir de ses propriétaires.',challenge:'Trouvez le détail le plus théâtral de la visite et donnez-lui un nom comme s’il s’agissait d’une scène d’opéra.',map:'Clam-Gallas Palace Prague',source:'https://www.visitczechia.com/en-us/news/2025/08/n-hidden-gems-of-prague'},
{id:'klementinum',name:'Le Klementinum',area:'Vieille-Ville · près de la Vltava',kind:'culture',tag:'Bibliothèque & panorama',season:'Intérieur · visite guidée / billet',intro:'Une bibliothèque baroque spectaculaire, une chapelle des miroirs et une tour astronomique au cœur d’un immense complexe historique.',story:'Le Klementinum est aussi connu pour ses relevés météorologiques réguliers, commencés au XVIIIe siècle. La visite relie livres, sciences, musique et observation du ciel.',look:'Dans la bibliothèque, observez les fresques, les globes et les rayonnages. À la tour, prenez le temps de reconnaître les quartiers et les ponts depuis les hauteurs.',challenge:'Repérez sur la vue panoramique trois lieux déjà visités et un endroit où vous aimeriez retourner.',map:'Klementinum Prague',source:'https://prague.eu/en/objevujte-category/monuments-architecture/'},
{id:'new-world',name:'Nový Svět, le « Nouveau Monde »',area:'Hradčany · près du château',kind:'balade',tag:'Ruelles & atmosphère',season:'Extérieur · idéal en promenade',intro:'Un petit quartier de maisons modestes et de ruelles tranquilles, à quelques minutes du château, qui semble loin de l’agitation touristique.',story:'Ce coin de Hradčany a conservé une échelle presque villageoise. Il est particulièrement agréable pour découvrir une autre ambiance après les grandes cours du château.',look:'Regardez les petites façades, les portes et les pavés. Le plaisir est dans les détails et dans le contraste avec les monuments tout proches.',challenge:'Choisissez votre maison préférée et inventez en une phrase la vie de ses anciens habitants. Respectez la tranquillité des résidents.',map:'Novy Svet Prague',source:'https://www.visitczechia.com/en-us/news/2025/08/n-hidden-gems-of-prague'},
{id:'strahov',name:'La bibliothèque de Strahov',area:'Hradčany · au-dessus de Malá Strana',kind:'culture',tag:'Bibliothèque historique',season:'Intérieur · accès réglementé',intro:'Deux salles historiques aux plafonds peints et des collections anciennes dans un monastère toujours en activité.',story:'Le monastère de Strahov date du XIIe siècle. Sa bibliothèque est l’un des ensembles historiques les plus remarquables de Prague ; l’accès à certaines salles peut être limité ou soumis à des conditions spécifiques.',look:'Depuis les zones accessibles, observez les fresques et les globes. Vérifiez avant de vous déplacer quelles salles sont ouvertes et si une réservation est nécessaire.',challenge:'Trouvez le livre ou le globe qui vous donne le plus envie de voyager dans le temps.',map:'Strahov Monastery Library Prague',source:'https://www.visitczechia.com/en-us/news/2025/08/n-hidden-gems-of-prague'},
{id:'lucerna',name:'Le passage Lucerna',area:'Nouvelle-Ville · près de Venceslas',kind:'insolite',tag:'Passage & art contemporain',season:'Intérieur · passage public',intro:'Un passage couvert Art nouveau avec une sculpture qui détourne avec humour un symbole national.',story:'Dans la galerie se trouve le cheval renversé de l’artiste David Černý : saint Venceslas chevauche un cheval suspendu à l’envers. Une œuvre qui joue avec l’iconographie monumentale de Prague.',look:'Levez les yeux dans la galerie et observez comment l’œuvre dialogue avec la coupole et l’architecture du passage.',challenge:'Prenez une photo créative de la sculpture sans gêner les passants. Qui trouve le meilleur angle ?',map:'Lucerna Passage Prague',source:'https://prague.eu/en/home/'},
{id:'narrow-street',name:'La ruelle la plus étroite',area:'Malá Strana · près de Čertovka',kind:'insolite',tag:'Curiosité urbaine',season:'Extérieur · passage étroit',intro:'Une minuscule ruelle piétonne équipée d’un feu pour organiser le passage dans les deux sens.',story:'La ruelle près de Čertovka est si étroite qu’un feu de signalisation régule le passage. C’est une curiosité amusante à repérer au cours d’une balade à Malá Strana.',look:'Repérez le feu à chaque extrémité et observez le passage depuis l’espace public. Ne bloquez pas la circulation des piétons.',challenge:'Attendez votre feu vert et faites une photo souvenir au milieu de ce passage minuscule.',map:'Vinarna Certovka Prague',source:'https://www.visitczechia.com/en-us/news/2025/08/n-hidden-gems-of-prague'},
{id:'vitkov',name:'Le mémorial de Vítkov',area:'Žižkov · panorama sur Prague',kind:'histoire',tag:'Histoire & panorama',season:'Extérieur + musée · horaires à vérifier',intro:'Un immense mémorial national sur une colline, dominé par une statue équestre monumentale et une vue dégagée sur la ville.',story:'Le lieu est lié à l’histoire de l’État tchécoslovaque et aux combats pour la liberté et la démocratie. Le bâtiment et ses expositions donnent une autre lecture de l’histoire contemporaine du pays.',look:'Depuis l’esplanade, prenez le temps de regarder la silhouette de la ville. La statue équestre est un repère spectaculaire, visible de loin.',challenge:'Essayez de reconnaître le château et les grands quartiers depuis le panorama. Vérifiez l’ouverture du musée avant de prévoir l’intérieur.',map:'National Memorial Vitkov Prague',source:'https://www.visitczechia.com/en-us/news/2025/08/n-hidden-gems-of-prague'},
{id:'new-mill',name:'La tour des Nouveaux Moulins',area:'Nouvelle-Ville · bord de la Vltava',kind:'histoire',tag:'Patrimoine & pompiers',season:'Intérieur · exposition à vérifier',intro:'Une ancienne tour d’eau baroque qui accueille une exposition consacrée aux incendies et aux pompiers de Prague.',story:'La tour rappelle le rôle de l’eau et des infrastructures dans la vie urbaine. Son exposition raconte les grands incendies qui ont marqué la ville et l’évolution des secours.',look:'Observez la silhouette de la tour depuis les berges, puis vérifiez si l’exposition est ouverte pendant votre séjour.',challenge:'Repérez un autre détail du vieux Prague lié à l’eau lors de votre promenade sur les quais.',map:'New Mill Water Tower Prague',source:'https://www.visitczechia.com/en-us/news/2025/08/n-hidden-gems-of-prague'}
,{id:'fanta',name:'La salle Fanta à la gare centrale',area:'Nouvelle-Ville · gare principale',kind:'culture',tag:'Art nouveau',season:'Intérieur · accès selon activité',intro:'Un décor Art nouveau spectaculaire que beaucoup de voyageurs traversent sans le remarquer.',story:'La partie historique de la gare principale, conçue par Josef Fanta et achevée en 1909, cache une architecture Art nouveau remarquable. Des visiteurs locaux recommandent de lever les yeux et de prendre le temps d’observer la salle historique.',look:'Repérez les ferronneries, les courbes et les détails décoratifs ; si le café historique est ouvert, c’est une pause dans un décor d’époque.',challenge:'Faites chacun une photo d’un détail Art nouveau que les voyageurs pressés ne voient pas.',map:'Fantova Kavarna Prague Main Railway Station',source:'https://discoveringprague.com/prague-hidden-gems-non-touristy-things-to-do/'},
{id:'babies-kampa',name:'Les bébés géants de Kampa',area:'Kampa · près du musée',kind:'insolite',tag:'Art contemporain',season:'Extérieur · promenade',intro:'Des sculptures monumentales de bébés rampants, avec des visages volontairement sans traits.',story:'Ces bébés sont une œuvre de David Černý. Leur présence décalée au milieu du parc crée un contraste amusant avec le décor historique de Malá Strana.',look:'Observez les proportions et les surfaces striées des visages. La promenade de Kampa permet aussi de profiter de vues différentes sur le pont Charles.',challenge:'Trouvez l’angle photo qui donne l’impression que le bébé est encore plus grand que vous.',map:'Kampa Crawling Babies Prague',source:'https://discoveringprague.com/prague-hidden-gems-non-touristy-things-to-do/'},
{id:'paternoster',name:'L’ascenseur paternoster de l’hôtel de ville',area:'Nouvelle-Ville · Mariánské náměstí',kind:'insolite',tag:'Curiosité mécanique',season:'Visite guidée · réservation à vérifier',intro:'Un ascenseur historique à cabines ouvertes qui circulent en continu, sans portes classiques.',story:'Le paternoster est une curiosité technique devenue rare. Prague City Tourism propose une visite dédiée à l’hôtel de ville et à cet ascenseur ; l’accès n’est pas à considérer comme libre, il faut vérifier les dates et réserver.',look:'Pendant la visite, observez le mouvement continu des cabines et le fonctionnement du système. Suivez impérativement les consignes du guide.',challenge:'Avant la visite, devinez comment on entre et sort d’une cabine qui ne s’arrête pas.',map:'Prague City Hall Marianske namesti',source:'https://prague.eu/en/objevujte/prague-city-hall-paternoster-tour/'},
{id:'camp',name:'CAMP, le centre d’architecture',area:'Nové Město · Emauzy',kind:'culture',tag:'Architecture & idées',season:'Intérieur · programme à consulter',intro:'Un lieu contemporain consacré à l’architecture et au développement urbain de Prague, avec expositions et café.',story:'CAMP est un centre de découverte de la ville : maquettes, cartes, projections et expositions permettent de comprendre comment Prague évolue au-delà de ses façades historiques.',look:'Regardez les cartes et les projets urbains comme une autre façon de lire la ville que vous parcourez à pied.',challenge:'Choisissez chacun un projet : lequel aimeriez-vous voir construit ou transformé ?',map:'CAMP Centre for Architecture and Metropolitan Planning Prague',source:'https://www.spottedbylocals.com/prague/'}
,{id:'idiom',name:'Idiom, la tour de livres infinie',area:'Vieille-Ville · bibliothèque municipale',kind:'insolite',tag:'Spot viral · illusion d’optique',season:'Intérieur · hall de bibliothèque',intro:'Une colonne de milliers de livres qui semble se prolonger à l’infini grâce à deux miroirs. Le spot photo devenu viral sur TikTok et Instagram.',story:'Créée par l’artiste slovaque Matej Krén, l’installation Idiom est visible dans le hall de la bibliothèque municipale. Son ouverture en forme de goutte permet de regarder dans un puits de livres qui paraît sans fin.',look:'Placez-vous face à l’ouverture et cherchez votre reflet dans les miroirs. L’effet est particulièrement spectaculaire en photo, mais le lieu reste une bibliothèque : discrétion et respect des lecteurs.',challenge:'Chacun prend une photo avec un angle différent : laquelle donne l’impression que la tour est vraiment infinie ?',map:'Idiom book tower Municipal Library Prague',source:'https://prague-secrete.fr/mes-endroits-insolites-a-prague/'}
,{id:'cubist-lamp',name:'Le lampadaire cubiste',area:'Nouvelle-Ville · Jungmannovo náměstí',kind:'insolite',tag:'Architecture · spot photo',season:'Extérieur · accès libre',intro:'Un lampadaire en forme de cristal, souvent présenté comme le seul lampadaire cubiste au monde.',story:'Dessiné par Emil Králíček au début du XXe siècle, ce réverbère en béton strié reprend les lignes anguleuses du cubisme tchèque. Il se cache au bord de Jungmannovo náměstí, près de l’église Notre-Dame-des-Neiges.',look:'Regardez la base et le fût : ils semblent taillés comme un cristal. Levez aussi les yeux vers les façades cubistes du quartier.',challenge:'Essayez de le photographier en faisant ressortir ses lignes géométriques, sans le confondre avec un lampadaire classique.',map:'Cubist Lamp Jungmannovo namesti Prague',source:'https://prague-secrete.fr/mes-endroits-insolites-a-prague/'}
,{id:'vojanovy',name:'Vojanovy sady et ses paons',area:'Malá Strana · près de la Vltava',kind:'balade',tag:'Jardin secret · animaux',season:'Extérieur · parc',intro:'Un jardin clos et paisible, avec des paons, des arbres fruitiers et de petits recoins à l’écart du flot touristique.',story:'Considéré comme l’un des plus anciens jardins de Prague, Vojanovy sady se cache derrière de hauts murs à Malá Strana. On y vient pour ralentir, croiser les paons et découvrir ses petites chapelles et son cadran solaire.',look:'Repérez les paons, la chapelle et les détails du jardin. C’est une parenthèse calme à quelques minutes des rues les plus fréquentées.',challenge:'Trouvez un paon et attendez un instant qu’il déploie sa queue — sans le poursuivre ni le nourrir.',map:'Vojanovy sady Prague',source:'https://www.helloprague.net/prague-hidden-gems/'}
,{id:'grebovka',name:'La grotte de Grébovka',area:'Vinohrady · Havlíčkovy sady',kind:'insolite',tag:'Grotte artificielle · décor romantique',season:'Extérieur · accès selon ouverture du parc',intro:'Une grotte artificielle avec fontaine, rochers et passages qui donnent l’impression d’avoir découvert un décor de conte.',story:'Au cœur du parc Havlíčkovy sady, aussi appelé Grébovka, cette grotte paysagée fait partie d’un ensemble romantique inspiré des jardins de villas italiennes. Le parc possède aussi un vignoble historique et de beaux points de vue.',look:'Observez les rochers, les niches et la fontaine de Neptune. Le décor change beaucoup selon la lumière et la saison.',challenge:'Trouvez le meilleur cadrage pour donner l’impression que vous avez découvert une grotte secrète en pleine ville.',map:'Grotta Havlickovy sady Prague',source:'https://www.visitczechia.com/en-us/news/2025/08/n-hidden-gems-of-prague'}
,{id:'r2d2',name:'R2-D2 dans le parc Folimanka',area:'Vinohrady · Folimanka',kind:'insolite',tag:'Street art · clin d’œil pop culture',season:'Extérieur · accès libre',intro:'Une bouche d’aération de bunker transformée en R2-D2 grandeur nature : le genre de découverte improbable qui fait sourire.',story:'Dans le parc Folimanka, une ancienne cheminée de ventilation du bunker de protection civile a été peinte pour ressembler au célèbre droïde de Star Wars. L’œuvre date de 2017 et est devenue un petit spot photo insolite.',look:'Faites le tour de la structure pour repérer les détails qui rappellent le robot. Le parc abrite aussi un grand abri souterrain, dont les visites sont ponctuelles.',challenge:'Prenez une photo en imitant une scène de Star Wars. Le meilleur résultat mérite un bruitage de droïde.',map:'R2-D2 Folimanka Park Prague',source:'https://www.atlasobscura.com/places/r2d2-of-prague'}
,{id:'tynska',name:'Týnská ulička, la ruelle derrière Týn',area:'Vieille-Ville · derrière l’église de Týn',kind:'balade',tag:'Ruelle médiévale · photo',season:'Extérieur · accès libre',intro:'Une petite ruelle médiévale à deux pas de la place de la Vieille-Ville, avec une vue très photogénique sur les tours de Týn.',story:'La ruelle longe l’arrière de l’église Notre-Dame-devant-Týn et conserve une atmosphère plus discrète que la grande place. Elle permet de découvrir les façades anciennes et les passages étroits de la Vieille-Ville.',look:'Placez-vous dans l’axe de la ruelle pour cadrer les pavés et les tours de l’église. Passez aussi par les petites cours voisines si elles sont ouvertes au public.',challenge:'Reproduisez une photo de carte postale, mais depuis cette ruelle plutôt que depuis la place principale.',map:'Tynska ulicka Prague',source:'https://www.helloprague.net/prague-hidden-gems/'}
,{id:'certovka-canal',name:'Čertovka, le petit canal caché',area:'Kampa · sous le pont Charles',kind:'balade',tag:'Canal secret · décor de carte postale',season:'Extérieur · promenade',intro:'Un bras d’eau bordé de maisons anciennes, de roues de moulin et de petits ponts, souvent invisible depuis le pont Charles.',story:'Le canal Čertovka sépare l’île de Kampa de Malá Strana. En descendant au niveau de l’eau, on découvre une Prague presque vénitienne, avec ses façades au ras du canal et les vestiges des anciens moulins.',look:'Repérez la roue du moulin du Grand Prieuré et les maisons qui semblent flotter au-dessus de l’eau. La lumière du matin ou de fin de journée est idéale pour les photos.',challenge:'Trouvez le reflet le plus réussi dans le canal et faites une photo sans pont Charles dans le cadre.',map:'Certovka canal Prague',source:'https://www.helloprague.net/prague-hidden-gems/'}

function render(){const q=search.value.trim().toLocaleLowerCase('fr');const list=places.filter(p=>(filter==='all'||(filter==='saved'?saved.includes(p.id):p.kind===filter))&&(!q||(p.name+' '+p.area+' '+p.intro+' '+p.tag).toLocaleLowerCase('fr').includes(q)));grid.innerHTML='';if(!list.length){grid.innerHTML='<p class="empty">Aucune découverte ne correspond. Essayez un autre mot ou filtre.</p>';return;}for(const p of list){const card=document.createElement('article');card.className='card';card.id='lieu-'+p.id;const ph=photos[p.id];card.innerHTML='<div class="card-visual"><img class="place-photo" src="'+(ph?ph.url:'https://commons.wikimedia.org/wiki/Special:FilePath/Praha.jpg?width=1200')+'" alt="'+esc(ph?ph.alt:'Vue de Prague')+'" loading="lazy" referrerpolicy="no-referrer"></div><div class="card-content"><div class="card-top"><span class="tag">'+esc(p.tag)+'</span><span class="season">'+esc(p.season)+'</span></div><h2>'+esc(p.name)+'</h2><p>'+esc(p.intro)+'</p><div class="card-bottom"><div><button class="save" data-save="'+p.id+'" aria-label="Ajouter aux favoris" aria-pressed="'+saved.includes(p.id)+'">'+(saved.includes(p.id)?'♥':'♡')+'</button> <button class="open" data-open="'+p.id+'" aria-expanded="false">Découvrir ↓</button> <button class="map-card-button" data-map-focus="'+p.id+'" type="button">Voir sur la carte</button></div></div></div><div class="detail"><h3>Pourquoi s’y arrêter</h3><p>'+esc(p.story)+'</p><h3>Le détail à observer</h3><p>'+esc(p.look)+'</p><h3>Votre mini-défi à deux</h3><p>'+esc(p.challenge)+'</p><div class="detail-actions"><a target="_blank" rel="noopener" href="'+maps(p)+'">Ouvrir dans Google Maps ↗</a><a target="_blank" rel="noopener" href="'+esc(p.source)+'">Source touristique ↗</a></div></div>';grid.append(card);}}
grid.addEventListener('click',e=>{const focus=e.target.closest('[data-map-focus]');if(focus){focusMapPoint(focus.dataset.mapFocus);return;}const save=e.target.closest('[data-save]');if(save){const id=save.dataset.save;saved=saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];try{localStorage.setItem(key,JSON.stringify(saved))}catch(e){}render();updateMapMarkers();return;}const open=e.target.closest('[data-open]');if(open){const card=open.closest('.card');card.classList.toggle('expanded');open.setAttribute('aria-expanded',String(card.classList.contains('expanded')));open.textContent=card.classList.contains('expanded')?'Refermer ↑':'Découvrir ↓';}});
filters.forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;filters.forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();}));
search.addEventListener('input',render);

let toastTimer;function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200);}

let discoveryMap=null;
let showPlannedMarkers=true,showDiscoveryMarkers=true;

function focusMapPoint(id){const marker=mapMarkers[id];if(!marker||!discoveryMap)return;const point=marker.getLatLng();document.getElementById("map-title").scrollIntoView({behavior:"smooth",block:"start"});setTimeout(()=>{discoveryMap.invalidateSize();discoveryMap.setView(point,16,{animate:true});marker.openPopup();},350);}

 'tynska':{date:'Jeudi 10 décembre',time:'17:00',slot:'Monuments de la Vieille-Ville',before:'Arrivée et installation au Kafka Prague rooms, vers 16:00.',after:'Dîner chez Maitrea, proposé à 19:00 (non réservé).'},
 'certovka-canal':{date:'Vendredi 11 décembre',time:'15:15–16:15',slot:'Mur Lennon, Čertovka et Kampa',before:'Nerudova et Saint-Nicolas, 14:30–15:15.',after:'Pont Charles et ses tours, 16:15–17:00.'},
 'babies-kampa':{date:'Vendredi 11 décembre',time:'15:15–16:15',slot:'Balade à Kampa (secteur prévu)',before:'Nerudova et Saint-Nicolas, 14:30–15:15.',after:'Pont Charles et ses tours, 16:15–17:00.'}
};
function markerIcon(isSaved,isPlanned){const color=isPlanned?'#168b58':isSaved?'#e53935':'#26384f';const glyph=isPlanned&&isSaved?'♥':isPlanned?'✓':isSaved?'♥':'';const html='<span style="display:flex;align-items:center;justify-content:center;width:29px;height:29px;border:3px solid #fff;border-radius:50%;background:'+color+';box-shadow:0 2px 8px #101a2b66;color:'+(isPlanned&&isSaved?'#ffdddd':'#fff')+';font:700 14px/1 Arial">'+glyph+'</span>';return L.divIcon({className:'favorite-map-marker',html:html,iconSize:[29,29],iconAnchor:[14,14],popupAnchor:[0,-14]});}
function updateMapMarkers(){Object.keys(mapMarkers).forEach(id=>mapMarkers[id].setIcon(markerIcon(saved.includes(id),!!plannedInfo[id])));refreshMapVisibility();}
function initMap(){
 if(!window.L)return;
 const map=L.map('prague-map',{scrollWheelZoom:false}).setView([50.0875,14.4213],13);discoveryMap=map;
 L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',{maxZoom:20,subdomains:['a','b','c'],attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> · <a href="https://www.openstreetmap.fr/" target="_blank" rel="noopener">OpenStreetMap France</a>'}).addTo(map);
 function markerIcon(isSaved,isPlanned){const color=isPlanned?'#168b58':isSaved?'#e53935':'#26384f';const glyph=isPlanned&&isSaved?'♥':isPlanned?'✓':isSaved?'♥':'';const html='<span style="display:flex;align-items:center;justify-content:center;width:29px;height:29px;border:3px solid #fff;border-radius:50%;background:'+color+';box-shadow:0 2px 8px #101a2b66;color:'+(isPlanned&&isSaved?'#ffdddd':'#fff')+';font:700 14px/1 Arial">'+glyph+'</span>';return L.divIcon({className:'favorite-map-marker',html:html,iconSize:[29,29],iconAnchor:[14,14],popupAnchor:[0,-14]});}
function updateMapMarkers(){Object.keys(mapMarkers).forEach(id=>mapMarkers[id].setIcon(markerIcon(saved.includes(id),!!plannedInfo[id])));}
places.forEach(p=>{const point=coords[p.id];if(!point)return;const info=plannedInfo[p.id];let popup='<strong>'+esc(p.name)+'</strong>';if(info){popup+='<div style="margin:7px 0;padding:8px 10px;background:#eaf6ef;border-radius:9px;color:#17633f"><b>✓ Déjà au programme</b><br>'+esc(info.date)+' · '+esc(info.time)+'<br><b>'+esc(info.slot)+'</b><br><br><b>Avant :</b> '+esc(info.before)+'<br><b>Après :</b> '+esc(info.after)+'</div>';}popup+='<a href="#lieu-'+p.id+'" data-map-place="'+p.id+'">Voir la découverte ↓</a>';mapMarkers[p.id]=L.marker(point,{icon:markerIcon(saved.includes(p.id),!!info)}).addTo(map).bindPopup(popup);});

  {id:'plan-castle',name:'Château de Prague',point:[50.0909,14.3985],date:'Vendredi 11 décembre',time:'11:00–13:30 environ',slot:'Visite guidée réservée',before:'Rendez-vous à Malostranská à 10:50.',after:'Déjeuner vers Nerudova, 13:30–14:30.'},
  {id:'plan-nicholas',name:'Saint-Nicolas de Malá Strana',point:[50.0881,14.4038],date:'Vendredi 11 décembre',time:'14:30–15:15',slot:'Nerudova et Saint-Nicolas',before:'Déjeuner vers Nerudova, 13:30–14:30.',after:'Mur Lennon, Čertovka et Kampa, 15:15–16:15.'},

  {id:'plan-kafka',name:'Tête tournante de Franz Kafka',point:[50.0812,14.4255],date:'Samedi 12 décembre',time:'10:55–11:20',slot:'Tête tournante de Franz Kafka',before:'Brunch au Café Louvre, 09:30–10:45.',after:'Accueil à l’agence de trike, 12:40.'},

  {id:'plan-cruise',name:'Croisière Prague Boats – jetée 4',point:[50.0934,14.4140],date:'Samedi 12 décembre',time:'Rendez-vous 17:45 · départ 18:00–18:50',slot:'Croisière réservée',before:'Petřín est facultatif ; transfert vers la jetée à effectuer en priorité.',after:'Dîner au Marina proposé à 20:30 (non réservé).'},

 ];
 plannedStops.forEach(p=>{
  const panel='<div style="margin:7px 0;padding:9px 10px;background:#eaf6ef;border-radius:9px;color:#17633f"><b>✓ Déjà au programme</b><br>'+esc(p.date)+' · '+esc(p.time)+'<br><b>'+esc(p.slot)+'</b><br><br><b>Avant :</b> '+esc(p.before)+'<br><b>Après :</b> '+esc(p.after)+'</div>';

}
document.getElementById('prague-map').addEventListener('click',e=>{const a=e.target.closest('[data-map-place]');if(a){const card=document.getElementById('lieu-'+a.dataset.mapPlace);if(card){card.classList.add('expanded');card.scrollIntoView({behavior:'smooth',block:'center'});}}});
initMap();
document.getElementById('show-planned').addEventListener('change',e=>{showPlannedMarkers=e.target.checked;refreshMapVisibility();});

render();
})();
